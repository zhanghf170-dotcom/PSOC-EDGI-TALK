# Infineon PSoC Edge E84 (PSE846GPS2DBZC4A) - Cortex-M55 + KitProg3 OpenOCD Config
# Used by both VS Code flash tasks (.vscode/flash_pse84.bat) and Cortex-Debug (.vscode/launch.json)

add_script_search_dir "D:/RT-ThreadStudio/repo/Extract/Debugger_Support_Packages/Infineon/OpenOCD-Infineon/2.0.0/scripts"
add_script_search_dir "D:/RT-ThreadStudio/repo/Extract/Debugger_Support_Packages/Infineon/OpenOCD-Infineon/2.0.0/flm/cypress/cat1d"

set RRAM_FLASHLOADER "D:/RT-ThreadStudio/repo/Extract/Debugger_Support_Packages/Infineon/OpenOCD-Infineon/2.0.0/flm/cypress/cat1d/PSE84_RRAM_NVM.FLM"
set QSPI_FLASHLOADER "D:/RT-ThreadStudio/repo/Extract/Debugger_Support_Packages/Infineon/OpenOCD-Infineon/2.0.0/flm/cypress/cat1d/PSE84_SMIF.FLM"

source [find interface/kitprog3.cfg]
transport select swd

set ENABLE_CM55 1
source [find target/infineon/pse84xgxs2.cfg]

cat1d.cm33 configure -rtos auto -rtos-wipe-on-reset-halt 1
cat1d.cm55 configure -rtos auto -rtos-wipe-on-reset-halt 1
gdb_breakpoint_override hard

if {$::ENABLE_ACQUIRE} {
    init
    reset init
}
